 const ratio=PHOTO_W/PHOTO_H,iw=im.naturalWidth,ih=im.naturalHeight;
 let sw=iw,sh=ih;
 if(iw/ih>ratio)sw=ih*ratio;else sh=iw/ratio;

$('photo').addEventListener('change',e=>{
 const f=e.target.files&&e.target.files[0];photoImage=null;
 const preview=$('preview');preview.style.display='none';preview.removeAttribute('src');
 if(!f)return;
 const reader=new FileReader();
 reader.onload=()=>{
  const img=new Image();
  img.onload=()=>{
   photoImage=img;
   const crop=croppedPhoto();
   if(crop){preview.src=crop.toDataURL('image/jpeg',.85);preview.style.display='block';preview.style.aspectRatio='251 / 354';preview.style.objectFit='cover'}
  };
  img.onerror=()=>alert('写真を読み込めませんでした。別の写真を選んでください。');
  img.src=reader.result;
 };
 reader.onerror=()=>alert('写真の読み込みに失敗しました');
 reader.readAsDataURL(f);
});

$('begin').onclick=()=>{player=$('name').value.trim()||'チャレンジャー';shop=$('shop').value.trim()||'店名未入力';index=0;correct=0;answers=Array(questions.length).fill(null);selected=false;show('quiz');render()};
function render(){selected=false;const q=questions[index];$('counter').textContent=`第${index+1}問 / 全${questions.length}問`;$('progress').style.width=`${index/questions.length*100}%`;$('question').textContent=q[0];$('backQuestion').disabled=index===0;const area=$('choices');area.replaceChildren();q[1].forEach((answer,i)=>{const b=document.createElement('button');b.className='choice';const sp=document.createElement('span');sp.className='letter';sp.textContent='ABCDE'[i];b.append(sp,document.createTextNode(answer));b.onclick=()=>pick(i);area.append(b)})}
function pick(i){if(selected)return;selected=true;answers[index]=i;index++;if(index===questions.length)finish();else render()}
$('backQuestion').onclick=()=>{if(index>0){index--;render()}};
$('cancelQuiz').onclick=()=>{if(confirm('検定をキャンセルして最初の画面に戻りますか？\n回答は保存されません。')){answers=[];show('start')}};

function getGrade(){return correct===30?1:correct>=23?2:correct>=15?3:correct>=8?4:5}
function finish(){correct=answers.reduce((n,a,i)=>n+(a===questions[i][2]?1:0),0);show('result');$('progress').style.width='100%';const grade=getGrade();$('resultName').textContent=(shop==='店名未入力'?'':shop+'　')+player;$('grade').textContent=grade+'級 認定！';$('score').textContent='';$('correctCount').textContent='';drawCertificate(grade);saveRoster(grade)}

function drawCertificate(grade){
 const canvas=$('certificate'),ctx=canvas.getContext('2d');canvas.width=900;canvas.height=850;
 const img=new Image();img.onload=()=>{
  ctx.clearRect(0,0,900,850);ctx.drawImage(img,0,0,900,850);
  // Each certificate illustration has a different native width. Rebuild the
  // entire photo frame at its own position, rather than placing a photo over
  // the pre-drawn portrait and leaving mismatched edges visible.
  if(photoImage&&photoImage.naturalWidth){
   const nativeWidths=[526,494,494,526,494];
   const nativeWidth=nativeWidths[grade-1];
   const leftNative=nativeWidth===526?347:315;
   const frameX=leftNative*900/nativeWidth;
   const frameY=50*850/(grade<=3?489:485);
   const frameW=(nativeWidth===526?149:150)*900/nativeWidth;
   const frameH=216*850/(grade<=3?489:485);
   const inset=8;
   const im=croppedPhoto();
   ctx.save();
   ctx.fillStyle='#ffffff';
   roundRect(ctx,frameX-2,frameY-2,frameW+4,frameH+4,17);
   ctx.fill();
   ctx.save();
   roundRect(ctx,frameX+inset,frameY+inset,frameW-inset*2,frameH-inset*2,8);
   ctx.clip();
   ctx.drawImage(im,frameX+inset,frameY+inset,frameW-inset*2,frameH-inset*2);
   ctx.restore();
   ctx.strokeStyle='#101010';ctx.lineWidth=6;
   roundRect(ctx,frameX+2,frameY+2,frameW-4,frameH-4,13);
   ctx.stroke();
   ctx.restore();
  }
  const colors=['#fff0bb','#dcf6ff','#ffe3ed','#e5fae9','#f0e3ff'];
  ctx.fillStyle=colors[grade-1];ctx.strokeStyle='#161616';ctx.lineWidth=6;
  roundRect(ctx,145,745,610,84,40);ctx.fill();ctx.stroke();
  const label=(shop==='店名未入力'?'':shop+'　')+player;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#171717';
  let size=48;do{ctx.font='900 '+size+'px sans-serif';size-=2}while(ctx.measureText(label).width>550&&size>20);
  ctx.fillText(label,450,787);
 };img.onerror=()=>alert('認定カードの画像を読み込めませんでした');img.src=CERT_IMAGES[grade-1];
}
$('save').onclick=()=>{const c=$('certificate');c.toBlob(async blob=>{if(!blob)return;const file=new File([blob],'takashi-kentei.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'たかし検定 認定証'});return}catch(e){if(e.name==='AbortError')return}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='takashi-kentei.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)},'image/png')};$('restart').onclick=()=>show('start');

const ROSTER_KEY='takashi_kentei_roster_v1';let rosterGrade=1;
function readRoster(){try{const a=JSON.parse(localStorage.getItem(ROSTER_KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}
function photoThumb(){if(!photoImage)return '';try{const c=document.createElement('canvas');c.width=c.height=180;const ctx=c.getContext('2d'),im=croppedPhoto();const side=Math.min(im.width,im.height),sx=(im.width-side)/2,sy=(im.height-side)/2;ctx.drawImage(im,sx,sy,side,side,0,0,180,180);return c.toDataURL('image/jpeg',.72)}catch(e){return ''}}
function saveRoster(grade){const entry={grade,shop:shop.trim(),name:player.trim(),score:correct*10,photo:photoThumb(),time:Date.now()};try{const a=readRoster().filter(e=>!(String(e.shop||'').trim()===entry.shop&&String(e.name||'').trim()===entry.name));a.unshift(entry);localStorage.setItem(ROSTER_KEY,JSON.stringify(a.slice(0,120)))}catch(e){console.warn('認定記録を保存できませんでした',e)}}
let adminMode=false;function renderRoster(){const tabs=$('rosterTabs');tabs.replaceChildren();tabs.style.display='none';const area=$('rosterEntries');area.replaceChildren();$('adminStatus').classList.toggle('hide',!adminMode);const all=readRoster().map((entry,idx)=>({entry,idx}));for(let g=1;g<=5;g++){const section=document.createElement('section');section.className='roster-grade-section';const heading=document.createElement('h2');heading.className='roster-grade-title';heading.textContent=g+'級';section.append(heading);const group=document.createElement('div');group.className='roster-grade-entries';const entries=all.filter(x=>Number(x.entry.grade)===g);if(!entries.length){const empty=document.createElement('p');empty.className='roster-empty';empty.textContent='まだ'+g+'級の認定者はいません';group.append(empty)}else{for(const {entry:e,idx} of entries){const row=document.createElement('div');row.className='roster-item';let photo;if(e.photo){photo=document.createElement('img');photo.className='roster-photo';photo.src=e.photo;photo.alt='認定者の顔写真'}else{photo=document.createElement('div');photo.className='roster-photo roster-placeholder';photo.textContent='👤'}const details=document.createElement('div');const shopEl=document.createElement('div');shopEl.className='roster-shop';shopEl.textContent=e.shop||'店名未入力';const nameEl=document.createElement('div');nameEl.className='roster-name';nameEl.textContent=e.name;const scoreEl=document.createElement('div');scoreEl.className='roster-score';scoreEl.textContent=e.score+' / 300点';details.append(shopEl,nameEl);row.append(photo,details);if(adminMode){const del=document.createElement('button');del.type='button';del.className='delete-entry';del.textContent='削除';del.setAttribute('aria-label',e.name+'さんの認定記録を削除');del.onclick=()=>{const all=readRoster();all.splice(idx,1);try{localStorage.setItem(ROSTER_KEY,JSON.stringify(all));renderRoster()}catch(err){alert('削除に失敗しました')}};row.append(del)}group.append(row)}}section.append(group);area.append(section)}};$('adminGear').onclick=()=>{if(adminMode){adminMode=false;renderRoster();return}const pw=prompt('管理パスワードを入力してください');if(pw===null)return;if(pw==='takashi0528'){adminMode=true;renderRoster()}else alert('パスワードが違います')};$('adminExit').onclick=()=>{adminMode=false;renderRoster()};$('openRoster').onclick=()=>{adminMode=false;rosterGrade=1;renderRoster();show('roster')};$('rosterBack').onclick=()=>{adminMode=false;show('start')};
</script></body></html>
